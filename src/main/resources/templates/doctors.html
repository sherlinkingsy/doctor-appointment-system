<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doctors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container mt-4">
    <h2>Our Doctors</h2>

    <p th:if="${#lists.isEmpty(doctors)}" class="text-muted">No doctors available.</p>

    <table class="table table-striped" th:unless="${#lists.isEmpty(doctors)}">
        <thead>
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>Specialty</th>
            <th>Experience (years)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d, stat : ${doctors}">
            <td th:text="${stat.count}">1</td>
            <td th:text="${d.name}">Name</td>
            <td th:text="${d.specialty}">Specialty</td>
            <td th:text="${d.experience}">0</td>
        </tr>
        </tbody>
    </table>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
