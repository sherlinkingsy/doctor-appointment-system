<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container mt-4" style="max-width: 500px;">
    <h2>You entered</h2>

    <div class="card p-3">
        <p><strong>Name:</strong> <span th:text="${name}">name</span></p>
        <p><strong>Age:</strong> <span th:text="${age}">0</span></p>
        <p><strong>Severity:</strong> <span th:text="${severity}">0</span></p>

        <p th:if="${severity >= 4}" class="text-danger fw-bold">High severity: this would need urgent attention.</p>
        <p th:if="${severity < 4}" class="text-success">Lower severity.</p>
    </div>

    <a th:href="@{/practice-form}" class="btn btn-secondary mt-3">Back</a>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
